name: Code Quality Check

on:
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Runner Check Code
    runs-on: ubuntu-latest
    steps:
      # 1. Tải code của nhánh PR về máy ảo GitHub
      - name: Checkout PR Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. ĐỒNG BỘ BỘ 3 FILE VALIDATION CHUẨN TỪ MAIN
      - name: Sync official configs from main
        run: |
          git fetch origin main
          git checkout origin/main -- ruff.toml .sqlfluff .pre-commit-config.yaml
          echo "✅ Đã ghi đè bộ 3 file validation bằng bản chính thức từ nhánh main!"

      # 3. Cài đặt môi trường Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 4. CHẠY TOÀN BỘ PRE-COMMIT HOOKS (ĐỒNG BỘ 100% VỚI LOCAL)
      # Action này tự đọc .pre-commit-config.yaml để quét đúng:
      # - Ruff (Python)
      # - SQLFluff (BigQuery trong src//db/bigquery/)
      # - Quét lộ Private Key & YAML format
      - name: Run Pre-Commit Hooks
        uses: pre-commit/action@v3.0.1
